[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ondemand-ai"
version = "1.14.0"
description = "Automation agent toolkit for the Ondemand platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ondemand AI", email = "dev@ondemand-ai.com.br"}
]
keywords = ["rpa", "automation", "supervisor", "ondemand"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "requests>=2.28.0",
    "httpx>=0.25.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
worker = [
    "temporalio>=1.7.0",
    "ondemand-obs[temporal]>=0.1.8",
]
# GPU provisioning on RunPod (training + inference orchestration). Kept optional
# so CPU robots never pull the SDK. VERIFY the pin against the tested SDK version.
runpod = [
    "runpod>=1.6.0",
]
# Confidence calibration (isotonic/Platt). Only needed to fit MarginCalibrator.
calibration = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://ondemand-ai.com.br"
Repository = "https://github.com/Ondemand-AI/ondemand-python"
Changelog = "https://github.com/Ondemand-AI/ondemand-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ondemand*"]
